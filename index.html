<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="EstilosPaginaConjunta.css">
    <title>Paginas Semestre</title>
</head>
<body>
    <nav class="navbar barra-superior">
        <span class="navbar-brand mb-0 h1">Paginas Semestre</span>
    </nav>

    <div class="container">
        <h1>Selecciona que pagina quieres acceder</h1>
        <p class="subtitulo">Elige una actividad del menu</p>

        <ul class="nav nav-pills justify-content-center mb-4" id="filtros">
            <li class="nav-item"><button class="nav-link active" data-filtro="todos">Todos</button></li>
            <li class="nav-item"><button class="nav-link" data-filtro="Basicos">Basicos</button></li>
            <li class="nav-item"><button class="nav-link" data-filtro="Condicionales">Condicionales</button></li>
            <li class="nav-item"><button class="nav-link" data-filtro="Ciclos">Ciclos</button></li>
            <li class="nav-item"><button class="nav-link" data-filtro="DOM">DOM</button></li>
            <li class="nav-item"><button class="nav-link" data-filtro="Clases">Clases</button></li>
            <li class="nav-item"><button class="nav-link" data-filtro="Metodos">Metodos</button></li>
        </ul>

        <div class="row mb-5">
            <div class="col-md-6 mb-4">
                <div class="menu-lista" id="lista"></div>
            </div>
            <div class="col-md-6">
                <div class="card panel" id="panel">
                    <div class="card-body p-4" id="panelContenido"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var actividades = [
            { titulo: 'Aprendiendo JavaScript', url: 'Aprendiendo.html', desc: 'Primer vistazo a JavaScript', cat: 'Basicos', nombre: 'Espresso' },
            { titulo: 'Introduccion de datos', url: 'Datos.html', desc: 'Primeros vistazos del prompt', cat: 'Basicos', nombre: 'Ristretto' },
            { titulo: 'Operadores', url: 'Operadores.html', desc: 'Ejemplos con los operadores basicos', cat: 'Basicos', nombre: 'Americano' },
            { titulo: 'Datos Personales', url: 'DatosPersonales.html', desc: 'Primer vistazo del if', cat: 'Condicionales', nombre: 'Moka' },
            { titulo: 'Edad', url: 'Edad.html', desc: 'Ejemplo de if basico con numero', cat: 'Condicionales', nombre: 'Cortado' },
            { titulo: 'Calificacion', url: 'Calificacion.html', desc: 'Ejemplo de if con numero', cat: 'Condicionales', nombre: 'Capuchino' },
            { titulo: 'Operaciones Basicas', url: 'OperacionesBasicas.html', desc: 'Ejemplo de switch', cat: 'Condicionales', nombre: 'Macchiato' },
            { titulo: 'Materias Aprobadas', url: 'Materias.html', desc: 'Ejercicio de switch y if sobre materias aprobadas o reprobadas', cat: 'Condicionales', nombre: 'Caramelo' },
            { titulo: 'Signos', url: 'Signos.html', desc: 'Ejercicio de switch y if sobre los signos basados en el dia y mes', cat: 'Condicionales', nombre: 'Latte' },
            { titulo: 'for', url: 'for.html', desc: 'Ejemplo basico del for', cat: 'Ciclos', nombre: 'Flat White' },
            { titulo: 'dom', url: 'dom.html', desc: 'Ejemplo en clase sobre el DOM', cat: 'DOM', nombre: 'Leche con canela' },
            { titulo: 'class', url: 'prueba.html', desc: 'Ejemplo de clases en JavaScript', cat: 'Clases', nombre: 'Crema' },
            { titulo: 'Metodos clave', url: 'Metodos.html', desc: 'Ejemplos de metodos clave en JavaScript', cat: 'Metodos', nombre: 'Espuma' }
        ];

        // Degradado continuo: del cafe mas oscuro al mas claro, en el orden de la lista
        (function asignarDegradado() {
            // Paradas del degradado (se mantiene calido en todo el recorrido)
            var paradas = [
                [43, 24, 16],     // #2b1810 espresso
                [111, 78, 55],    // #6f4e37 cafe
                [184, 134, 85],   // #b88655 caramelo
                [243, 229, 212]   // #f3e5d4 espuma
            ];
            var total = actividades.length - 1;
            actividades.forEach(function (a, i) {
                var pos = (i / total) * (paradas.length - 1);
                var k0 = Math.min(Math.floor(pos), paradas.length - 2);
                var t = pos - k0;
                var rgb = paradas[k0].map(function (c, k) {
                    return Math.round(c + (paradas[k0 + 1][k] - c) * t);
                });
                a.tono = '#' + rgb.map(function (c) {
                    return ('0' + c.toString(16)).slice(-2);
                }).join('');
            });
        })();

        var lista = document.getElementById('lista');
        var panel = document.getElementById('panel');
        var panelContenido = document.getElementById('panelContenido');
        var filtroActual = 'todos';
        var seleccion = 0;

        function colorTexto(hex) {
            var r = parseInt(hex.slice(1, 3), 16);
            var g = parseInt(hex.slice(3, 5), 16);
            var b = parseInt(hex.slice(5, 7), 16);
            var brillo = (r * 299 + g * 587 + b * 114) / 1000;
            return brillo > 150 ? '#3e2415' : '#fffaf3';
        }

        function visibles() {
            var res = [];
            actividades.forEach(function (a, i) {
                if (filtroActual === 'todos' || a.cat === filtroActual) res.push(i);
            });
            return res;
        }

        function pintarLista() {
            lista.innerHTML = '';
            var vis = visibles();
            vis.forEach(function (i) {
                var a = actividades[i];
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-item';
                btn.dataset.i = i;
                btn.style.setProperty('--tono', a.tono);
                btn.style.setProperty('--texto-tono', colorTexto(a.tono));
                btn.textContent = a.titulo;
                btn.addEventListener('click', function () { seleccionar(i); });
                btn.addEventListener('dblclick', function () { abrir(i); });
                lista.appendChild(btn);
            });
            if (vis.length) {
                seleccionar(vis.indexOf(seleccion) === -1 ? vis[0] : seleccion);
            } else {
                panelContenido.innerHTML = '<p class="mb-0">No hay actividades en esta categoria.</p>';
            }
        }

        function seleccionar(i) {
            seleccion = i;
            var a = actividades[i];
            panel.style.setProperty('--tono', a.tono);
            panel.style.setProperty('--texto-tono', colorTexto(a.tono));
            document.querySelectorAll('.btn-item').forEach(function (el) {
                el.classList.toggle('seleccionado', Number(el.dataset.i) === i);
            });
            panelContenido.innerHTML =
                '<span class="badge badge-light mb-3">' + a.cat + '</span>' +
                '<h2 class="h3">' + a.titulo + '</h2>' +
                '<p>' + a.desc + '</p>' +
                '<button type="button" class="btn btn-abrir mt-2" id="btnAbrir">Abrir actividad</button>';
            document.getElementById('btnAbrir').addEventListener('click', function () { abrir(i); });
        }

        function abrir(i) {
            window.location.href = actividades[i].url;
        }

        document.getElementById('filtros').addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-filtro]');
            if (!btn) return;
            document.querySelectorAll('#filtros .nav-link').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            filtroActual = btn.dataset.filtro;
            pintarLista();
        });

        pintarLista();
    </script>
</body>
</html>
